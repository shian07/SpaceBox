<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Spacebox app icon: a squarified treemap in a rounded tile.
       Colours mirror src/theme.rs so the icon reads as the same product. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23272f"/>
      <stop offset="1" stop-color="#131519"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect x="16" y="16" width="224" height="224" rx="52"/>
    </clipPath>
  </defs>

  <!-- Rounded tile -->
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#tile)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#sheen)"/>
  <rect x="16.75" y="16.75" width="222.5" height="222.5" rx="51.25"
        fill="none" stroke="#3a4150" stroke-width="1.5"/>

  <g clip-path="url(#clip)">
    <!-- Treemap tiles, 3px gutters, echoing the squarified layout -->
    <!-- Large upper-left block (video, coral) -->
    <rect x="44" y="44" width="100" height="100" rx="8" fill="#e06070"/>
    <!-- Tall right column (code, cyan) -->
    <rect x="150" y="44" width="62" height="124" rx="8" fill="#54beec"/>
    <!-- Lower-left wide block (image, amber) -->
    <rect x="44" y="150" width="62" height="62" rx="8" fill="#f0a048"/>
    <!-- Lower-mid block (audio, violet) -->
    <rect x="112" y="150" width="38" height="62" rx="8" fill="#c480f0"/>
    <!-- Lower-right small block (document, mint) -->
    <rect x="156" y="174" width="56" height="38" rx="7" fill="#6cd09c"/>
    <!-- Bottom-right accent sliver (data, periwinkle) -->
    <rect x="156" y="150" width="56" height="18" rx="6" fill="#78a0f6"/>
  </g>
</svg>
