name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Fast gate: formatting and lints run once, not per platform.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxft-dev libxcursor-dev libxinerama-dev \
            libxrender-dev libxfixes-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # FLTK is bundled and compiled from source by fltk-sys; on Linux the
      # X11/font development headers must be present first.
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxft-dev libxcursor-dev libxinerama-dev \
            libxrender-dev libxfixes-dev
      - name: Ninja for macOS/Windows builds
        if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@master

      - run: cargo test --locked
      - run: cargo build --release --locked

  bundle:
    name: bundle (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: spacebox-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: spacebox-linux-aarch64.tar.gz
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: spacebox-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: spacebox-macos-arm64.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: spacebox-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libx11-dev libxft-dev libxcursor-dev libxinerama-dev \
            libxrender-dev libxfixes-dev
      - name: Install ARM64 cross toolchain
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list || true
          echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports $(. /etc/os-release && echo $VERSION_CODENAME) main universe" | sudo tee /etc/apt/sources.list.d/arm64.list
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libx11-dev:arm64 libxft-dev:arm64 libxcursor-dev:arm64 \
            libxinerama-dev:arm64 libxrender-dev:arm64 libxfixes-dev:arm64
      - if: runner.os != 'Linux'
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          set -e
          STAGE="spacebox-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/spacebox "$STAGE/"
          cp README.md LICENSE "$STAGE/"
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp -r packaging "$STAGE/"
            cp -r assets "$STAGE/"
          fi
          tar -czf "${{ matrix.archive }}" "$STAGE"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "spacebox-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/spacebox.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # Distribution packages built on a Linux runner: deb, rpm, Arch and a
  # cross-compiled Windows exe. Requires the mingw-w64 cross toolchain.
  packages:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install build + packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 rpm zip librsvg2-bin libarchive-tools \
            libx11-dev libxft-dev libxcursor-dev libxinerama-dev \
            libxrender-dev libxfixes-dev
      - name: Build packages (deb, rpm, win)
        env:
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
          SPACEBOX_MAINTAINER: ${{ github.repository_owner }}
        run: ./packaging/build-packages.sh deb rpm win
      - name: Build Arch package (in an Arch container)
        run: |
          docker run --rm -v "$PWD:/src" -w /src archlinux:latest bash -c '
            pacman -Sy --noconfirm base-devel libarchive rsvg-convert 2>/dev/null || true
            useradd -m builder && chown -R builder /src
            su builder -c "./packaging/build-packages.sh arch" || true
          '
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/*
          if-no-files-found: warn

  publish:
    needs: [bundle, packages]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
